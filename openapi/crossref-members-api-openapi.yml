openapi: 3.2.0
info:
  title: Crossref Members API
  description: The Crossref REST API is one of a variety of tools and APIs that allow anybody to search and reuse our members' metadata in sophisticated ways.
  contact:
    name: Crossref
    url: https://crossref.org
    email: support@crossref.org
  version: 3.32.0
servers:
- url: /
tags:
- name: Members
  description: Endpoints that expose member related data
paths:
  /members/{id}/works:
    get:
      tags:
      - Members
      description: Returns list of works associated with a Crossref member (deposited by a Crossref member) with {id}.
      parameters:
      - name: rows
        in: query
        description: The number of rows per page
        schema:
          type: integer
          format: int64
      - name: order
        in: query
        description: Combined with sort can be used to specify the order of results, e.g. asc or desc
        schema:
          pattern: (asc|desc)
          type: string
      - name: facet
        in: query
        description: Exposes the ability to retrieve counts for pre-defined facets e.g. `type-name:*` returns counts of all works by type
        schema:
          type: string
      - name: sample
        in: query
        description: Exposes the ability to return `N` randomly sampled items
        schema:
          type: integer
          format: int64
      - name: sort
        in: query
        description: Exposes the ability to sort results by a certain field, e.g. `score`
        schema:
          type: string
      - name: offset
        in: query
        description: The number of rows to skip before returning
        schema:
          type: integer
          format: int64
      - name: mailto
        in: query
        description: The email address to identify yourself and be in the "polite pool"
        schema:
          pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,6}$
          type: string
      - name: select
        in: query
        description: Exposes the ability to select certain fields, supports a comma separated list of fields, e.g. `DOI,volume`
        schema:
          pattern: ^\w+(,\w+)*$
          type: string
      - name: query
        in: query
        description: Exposes the ability to free text query certain fields
        schema:
          type: string
      - name: filter
        in: query
        description: Exposes the ability to filter by certain fields, supports a comma separated list of lucene filters, e.g. `content-domain:psychoceramics.labs.crossref.org`
        schema:
          type: string
      - name: cursor
        in: query
        description: Exposes the ability to deep page through large result sets, where offset would cause performance problems
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A list of works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorksMessage'
      summary: Get members by id works
      x-summary-source: derived
      operationId: getMembersByIdWorks
      x-operation-id-source: derived
  /members/{id}:
    get:
      tags:
      - Members
      description: Returns metadata for a Crossref member, as an example use id 324
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The prefix data identified by {id}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberMessage'
        '404':
          description: The prefix data identified by {id} does not exist.
          content: {}
      summary: Get members by id
      x-summary-source: derived
      operationId: getMembersById
      x-operation-id-source: derived
  /members:
    get:
      tags:
      - Members
      description: 'Returns a list of all Crossref members (mostly publishers).

        ## Queries


        Free form search queries can be made, for example, funders that include `association` and `library`:


        ##


        ```

        /members?query=association+library

        ```


        ## Filters


        Filters allow you to select items based on specific criteria. All filter results are lists.


        ##


        Example:


        ##

        ```

        /members?filter=current-doi-count:0

        ```

        ##


        ### Multiple filters


        Multiple filters can be specified in a single query. In such a case, different filters will be applied with AND semantics, while specifying the same filter multiple times will result in OR semantics - that is, specifying the filters:


        - `current-doi-count:0`

        - `backfile-doi-count:0`

        - `prefix:10.1296`

        - `prefix:10.2481`


        would locate members with no current DOIs and no backfile DOIs and with prefix 10.1296 or 10.2481. These filters would be specified by joining each filter together with a comma:


        ##

        ```

        /members?filter=current-doi-count:0,backfile-doi-count:0,prefix:10.1296,prefix:10.2481

        ```

        ##


        This endpoint supports the following filters:


        ##


        + `backfile-doi-count` - members with given count of DOIs for material published more than two years ago

        + `current-doi-count` - members with given count of DOIs for material published within last two years

        + `prefix` - members with given prefix

        ## Pagination with offsets


        Offsets can be used to iterate over the results. For this route, the maximum number of available results is 80,000, which in this case allows to retrieve all the indexed items. This limit applies to the sum of values of parameters `offset` + `rows`.


        ##


        The number of items returned in a single response is controlled by `rows` parameter (default is 20, and maximum is 1,000). To limit results to 5, for example, you could do the following:


        ##


        ```

        /works?query=allen+renear&rows=5

        ```


        ##


        `offset` parameter can be used to retrieve items starting from a specific index of the result list. For example, to select the second set of 5 results (i.e. results 6 through 10), you would do the following:


        ##


        ```

        /works?query=allen+renear&rows=5&offset=5

        ```


        ##


        ## Deep paging


        Deep paging using cursors can be used to iterate over large result sets, without any limits on their size.


        ##


        To use deep paging make a query as normal, but include the `cursor` parameter with a value of `*`, for example:


        ##


        ```

        /members/311/works?filter=type:journal-article&cursor=*

        ```


        ##


        A `next-cursor` field will be provided in the JSON response. To get the next page of results, pass the value of `next-cursor` as the cursor parameter (remember to URL-encode). For example:


        ##


        ```

        /members/311/works?filter=type:journal-article&cursor=

        ```


        ##


        Clients should check the number of returned items. If the number of returned items is equal to the number of expected rows then the end of the result set has been reached. Using next-cursor beyond this point will result in responses with an empty items list. Cursors expire after 5 minutes if they are not used.


        ##'
      parameters:
      - name: cursor
        in: query
        description: Exposes the ability to deep page through large result sets, where offset would cause performance problems
        schema:
          type: string
      - name: filter
        in: query
        description: Exposes the ability to filter by certain fields, supports a comma separated list of lucene filters, e.g. `content-domain:psychoceramics.labs.crossref.org`
        schema:
          type: string
      - name: query
        in: query
        description: Exposes the ability to free text query certain fields
        schema:
          type: string
      - name: rows
        in: query
        description: The number of rows per page
        schema:
          type: integer
          format: int64
      - name: mailto
        in: query
        description: The email address to identify yourself and be in the "polite pool"
        schema:
          pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,6}$
          type: string
      - name: offset
        in: query
        description: The number of rows to skip before returning
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A collection of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersMessage'
      summary: Get members
      x-summary-source: derived
      operationId: getMembers
      x-operation-id-source: derived
